<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>명훈쌤 생신 편지 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-6">

  <!-- 메인 투표 화면 (gekojoon.com) -->
  <main id="user-view" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 mt-6 hidden">
    <div class="text-center mb-6">
      <span class="bg-rose-100 text-rose-600 font-semibold text-xs px-3 py-1 rounded-full">🎂 생신 축하 이벤트</span>
      <h1 class="text-2xl font-bold text-slate-900 mt-2">명훈쌤 생신 편지 투표</h1>
      <p class="text-slate-500 text-sm mt-1">명훈쌤께 전달할 생신 편지 문구를 선택해주세요!</p>
    </div>

    <form id="vote-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">투표자 이름</label>
        <input type="text" id="voter-name" required placeholder="이름을 입력하세요"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">편지 시안 선택</label>
        <div class="space-y-3">
          <label class="flex items-start p-3.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition border-slate-200">
            <input type="radio" name="letter-option" value="시안 1: 감동형 (스승의 은혜 강조)" required class="mt-1 text-rose-600 focus:ring-rose-500">
            <div class="ml-3">
              <span class="block text-sm font-semibold text-slate-900">시안 1. 감동형</span>
              <span class="block text-xs text-slate-500 mt-0.5">"언제나 저희를 따뜻하게 지도해주시는 명훈쌤, 생신 진심으로 축하드립니다!"</span>
            </div>
          </label>

          <label class="flex items-start p-3.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition border-slate-200">
            <input type="radio" name="letter-option" value="시안 2: 위트형 (유쾌한 축하)" class="mt-1 text-rose-600 focus:ring-rose-500">
            <div class="ml-3">
              <span class="block text-sm font-semibold text-slate-900">시안 2. 위트형</span>
              <span class="block text-xs text-slate-500 mt-0.5">"명훈쌤의 생신을 축하드립니다! 오늘 하루는 세상에서 가장 행복한 하루 되세요!"</span>
            </div>
          </label>

          <label class="flex items-start p-3.5 border rounded-xl cursor-pointer hover:bg-slate-50 transition border-slate-200">
            <input type="radio" name="letter-option" value="시안 3: 짧고 강렬한 메시지" class="mt-1 text-rose-600 focus:ring-rose-500">
            <div class="ml-3">
              <span class="block text-sm font-semibold text-slate-900">시안 3. 짧고 강렬한 메시지</span>
              <span class="block text-xs text-slate-500 mt-0.5">"명훈쌤 최고! 생신 축하드려요 🎉"</span>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-rose-200">
        투표 제출하기
      </button>
    </form>

    <div id="success-msg" class="hidden text-center py-8">
      <div class="text-4xl mb-3">🎉</div>
      <h3 class="text-xl font-bold text-slate-900">투표가 완료되었습니다!</h3>
      <p class="text-slate-500 text-sm mt-1">소중한 의견을 반영하여 명훈쌤께 전해드릴게요.</p>
    </div>
  </main>

  <!-- 관리자 패널 (joon.gekojoon.com) -->
  <section id="admin-view" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl p-6 mt-6 hidden">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">🔒 관리자 패널</h1>
        <p class="text-slate-500 text-sm">joon.gekojoon.com 접속 전용 실시간 투표 및 IP 모니터링</p>
      </div>
      <button id="refresh-btn" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg transition">
        새로고침
      </button>
    </div>

    <!-- 통계 요약 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <span class="text-xs text-slate-500 font-medium">총 참여 투표 수</span>
        <div id="total-count" class="text-2xl font-bold text-slate-900 mt-1">0표</div>
      </div>
      <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <span class="text-xs text-slate-500 font-medium">최근 투표 시각</span>
        <div id="last-updated" class="text-sm font-semibold text-slate-700 mt-1">-</div>
      </div>
    </div>

    <!-- 상세 목록 테이블 -->
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm border-collapse">
        <thead>
          <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
            <th class="p-3">이름</th>
            <th class="p-3">선택한 시안</th>
            <th class="p-3">IP 주소</th>
            <th class="p-3">일시</th>
          </tr>
        </thead>
        <tbody id="vote-table-body" class="divide-y divide-slate-100 text-slate-700">
          <tr>
            <td colspan="4" class="p-4 text-center text-slate-400">데이터를 불러오는 중...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Firebase & App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1i2JDosCgSAKStg6lZfqD8sEkFBPPKyM",
      authDomain: "code-8edf2.firebaseapp.com",
      projectId: "code-8edf2",
      storageBucket: "code-8edf2.firebasestorage.app",
      messagingSenderId: "874029593317",
      appId: "1:874029593317:web:11e19d15053dd8aa2b1a0c",
      measurementId: "G-694C7PL2C4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // IP 수집 함수
    async function getUserIP() {
      try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        return data.ip;
      } catch (e) {
        return "IP 확인 불가";
      }
    }

    // 도메인 판별 (joon.gekojoon.com 접속 시 관리자 화면 표시)
    const hostname = window.location.hostname;
    const isAdmin = hostname === "joon.gekojoon.com" || window.location.search.includes("admin=true");

    const userView = document.getElementById("user-view");
    const adminView = document.getElementById("admin-view");

    if (isAdmin) {
      adminView.classList.remove("hidden");
      loadAdminData();
    } else {
      userView.classList.remove("hidden");
    }

    // [사용자] 투표 제출 처리
    const voteForm = document.getElementById("vote-form");
    voteForm?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerText = "제출 중...";

      const name = document.getElementById("voter-name").value.trim();
      const selectedOption = document.querySelector('input[name="letter-option"]:checked')?.value;
      const userIp = await getUserIP();

      try {
        await addDoc(collection(db, "votes"), {
          voterName: name,
          option: selectedOption,
          ipAddress: userIp,
          createdAt: serverTimestamp()
        });

        voteForm.classList.add("hidden");
        document.getElementById("success-msg").classList.remove("hidden");
      } catch (err) {
        alert("투표 저장 중 오류가 발생했습니다. 다시 시도해 주세요.");
        submitBtn.disabled = false;
        submitBtn.innerText = "투표 제출하기";
      }
    });

    // [관리자] 투표 내역 및 IP 로드
    async function loadAdminData() {
      const tbody = document.getElementById("vote-table-body");
      const totalCount = document.getElementById("total-count");
      const lastUpdated = document.getElementById("last-updated");

      tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">데이터를 불러오는 중...</td></tr>`;

      try {
        const q = query(collection(db, "votes"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        totalCount.innerText = `${snapshot.size}표`;

        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">아직 제출된 투표가 없습니다.</td></tr>`;
          lastUpdated.innerText = "-";
          return;
        }

        tbody.innerHTML = "";
        let firstRow = true;

        snapshot.forEach((doc) => {
          const data = doc.data();
          const dateStr = data.createdAt?.toDate
            ? data.createdAt.toDate().toLocaleString("ko-KR")
            : "방금 전";

          if (firstRow) {
            lastUpdated.innerText = dateStr;
            firstRow = false;
          }

          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
          tr.innerHTML = `
            <td class="p-3 font-semibold text-slate-900">${data.voterName || "익명"}</td>
            <td class="p-3 text-slate-800">${data.option}</td>
            <td class="p-3 font-mono text-xs text-rose-600 bg-rose-50 rounded px-2 py-1 inline-block my-2">${data.ipAddress}</td>
            <td class="p-3 text-xs text-slate-400">${dateStr}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-rose-500">데이터 로드 실패: ${err.message}</td></tr>`;
      }
    }

    document.getElementById("refresh-btn")?.addEventListener("click", loadAdminData);
  </script>
</body>
</html>
