<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- 구글 폰트 (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- 구글 공식 reCAPTCHA v2 스크립트 추가 -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0f12;
            color: #e1e4e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 배경 미세한 그라데이션 및 블러 효과 */
        .background-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(13, 15, 18, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(22, 27, 34, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 440px;
            width: 90%;
        }

        .error-code {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -1px;
            color: #f0f6fc;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #8b949e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-message {
            font-size: 0.95rem;
            color: #8b949e;
            margin-bottom: 28px;
            line-height: 1.5;
            font-weight: 300;
        }

        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            transform: scale(0.95);
            transform-origin: center;
        }

        #success-notice {
            font-size: 0.85rem;
            color: #3fb950;
            margin-top: -14px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        /* 버튼 그룹 스타일 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            
            /* 초기 비활성화 상태 */
            background-color: rgba(255, 255, 255, 0.03);
            color: #484f58;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 인증 완료 후 활성화된 상태 */
        .btn.enabled {
            cursor: pointer;
            pointer-events: auto;
        }

        .btn.enabled.btn-youtube {
            background-color: #ff0000;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn.enabled.btn-youtube:hover {
            background-color: #e00000;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }

        .btn.enabled.btn-sub {
            background-color: rgba(255, 255, 255, 0.05);
            color: #e1e4e8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn.enabled.btn-sub:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="container">
        <h1 class="error-code">404</h1>
        <p class="error-message">페이지를 이용하시려면 아래 보안 인증을 완료해 주세요.</p>

        <!-- 방금 발급받은 사이트 키가 적용된 구글 리캡쳐 위젯 -->
        <div class="recaptcha-wrapper">
            <div class="g-recaptcha" data-sitekey="6LczOLQTAAAANU6e49GKtfg6SxzR-a2p8jsQnze" data-callback="verifyCallback"></div>
        </div>

        <div id="success-notice">✓ 인증이 완료되었습니다. 이동이 가능합니다!</div>

        <div class="button-group">
            <a id="btn-kyungjun" href="https://youtube.com/@경준tv" target="_blank" class="btn btn-youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                경준tv 바로가기
            </a>
            <a id="btn-geko" href="https://youtube.com/@geko_snake" target="_blank" class="btn btn-sub">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                게코뱀 바로가기
            </a>
        </div>
    </div>

    <!-- reCAPTCHA v2 인증 성공 시 호출되는 콜백 함수 -->
    <script>
        function verifyCallback(response) {
            if (response) {
                // 성공 문구 표시
                document.getElementById('success-notice').style.display = 'block';
                
                // 경준tv 버튼 활성화
                document.getElementById('btn-kyungjun').classList.add('enabled');
                
                // 게코뱀 버튼 활성화
                document.getElementById('btn-geko').classList.add('enabled');
            }
        }
    </script>
</body>
</html>
